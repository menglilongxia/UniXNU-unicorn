name: kernel-macos
'on':
  workflow_dispatch:
    inputs:
      os_profile:
        description: OS profile
        required: true
        default: ipados-18.7.10-22H374
        type: choice
        options:
        - ipados-18.7.10-22H374
        - ipados-16.6.1-20G81
      prelink:
        description: 是否做 prelink（首次先 false，用原生内核）
        required: true
        default: false
        type: boolean
      volume_layout_run:
        description: 复用某个既有 run 的 volume layout（填 run id；留空则重新跑 userdata）
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
env:
  DEVICE: unicorn
  OS_PROFILE: ${{ inputs.os_profile }}
  UNIXNU_REF: 0fc0fc1f9ddd0fbd4787738afef38667df5e0a95
jobs:
  kernel:
    name: kernel + payload + boot image
    runs-on: macos-15-intel
    timeout-minutes: 240
    steps:
    - name: checkout device repository
      uses: actions/checkout@v4
      with:
        path: device
        submodules: recursive
    - name: checkout UniXNU framework (pinned)
      uses: actions/checkout@v4
      with:
        repository: UniXNU/UniXNU
        ref: ${{ env.UNIXNU_REF }}
        path: UniXNU
    - name: checkout uefi-unicorn (boot image inputs)
      uses: actions/checkout@v4
      with:
        repository: zhouzhoublm/uefi-unicorn
        path: uefi-unicorn
    - name: setup python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: reclaim disk
      run: "sudo rm -rf /Users/runner/Library/Developer/CoreSimulator \\\n            /Applications/Xcode_15*.app 2>/dev/null || true\ndf -h /\n"
    - name: select Xcode
      run: 'sudo xcode-select -s /Applications/Xcode.app

        xcodebuild -version

        xcrun --sdk iphoneos --show-sdk-path

        '
    - name: platform seed (secret)
      env:
        CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
      run: "case \"${CHIP_ID}\" in\n  [0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F]) ;;\n  *) echo 'secret UNIXNU_UNIQUE_CHIP_ID 必须是 8 位十六进制' >&2; exit 1 ;;\nesac\nprintf '%s\\n' \"${CHIP_ID}\" > device/.unique-chip-id\n"
    - name: bootstrap (pin / soc seed / profile / defconfig / fetch)
      working-directory: device
      run: 'python3.12 -m pip install --quiet --upgrade pip

        bash scripts/bootstrap-unicorn.sh --unixnu ../UniXNU --soc ../soc-seed

        '
    - name: install build tools
      run: |
        set -euo pipefail
        brew install --quiet cmake ninja unifdef dtc lzfse mtools llvm lld
        echo "/usr/local/opt/llvm/bin:/usr/local/opt/lld/bin" >> "$GITHUB_PATH"
        export PATH="/usr/local/opt/llvm/bin:/usr/local/opt/lld/bin:$PATH"
        for t in cmake ninja unifdef dtc lzfse mformat clang llvm-objcopy llvm-nm; do
          command -v "$t" || exit 1
        done
    - name: pin baseline machine config (BCM2837 -> PONG)
      working-directory: device
      run: 'bash scripts/pin-baseline-machine-config.sh ../UniXNU

        '
    - name: download the volume layout from the userdata job
      run: 'set -euo pipefail

        RUN_ID="${{ inputs.volume_layout_run }}"

        [ -n "$RUN_ID" ] || RUN_ID="${{ github.run_id }}"

        echo "download volume-layout from run ${RUN_ID}"

        rm -rf ci-volume-layout && mkdir -p ci-volume-layout

        gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n volume-layout -D ci-volume-layout

        ls -l ci-volume-layout

        '
      env:
        GH_TOKEN: ${{ github.token }}
    - name: seed private-inputs/volume-layout.json
      run: "set -euo pipefail\nmkdir -p private-inputs\ncp ci-volume-layout/ci-volume-layout.json private-inputs/volume-layout.json\npython3 - <<'PY'\nimport json, pathlib\nd = json.loads(pathlib.Path('private-inputs/volume-layout.json').read_text())\nif d.get('ci_placeholder'):\n    raise SystemExit('volume layout still holds placeholders')\nfor key in ('os', 'systemos', 'data'):\n    if len(d.get(key, {}).get('uuid', '')) != 36:\n        raise SystemExit('no usable %s uuid' % key)\nprint('volume layout ok')\nPY\n"
    - name: assemble tree
      working-directory: UniXNU
      env:
        UNIXNU_DEVICE: ${{ github.workspace }}/device
      run: 'python3.12 ./unixnu tree -D ../device

        ls -d ../UniXNU/out/unicorn/${OS_PROFILE}/unicorn_ipados18/tree

        '
    - name: compile hardware device tree
      working-directory: device
      run: 'OUT=../UniXNU/out/unicorn/${OS_PROFILE}/unicorn_ipados18

        mkdir -p "$OUT/device-tree"

        dtc -I dts -O dtb -i ../soc-seed/dts -o "$OUT/device-tree/hardware.dtb" dts/unicorn.dts

        ls -l "$OUT/device-tree/hardware.dtb"

        '
    - name: stage Apple components (decompressed kernelcache) for the storage step
      working-directory: device
      run: "set -euo pipefail\nURL=$(python3 -c \"import tomllib,pathlib;print(tomllib.loads(pathlib.Path('board.toml').read_text())['ipsw']['url'])\")\nSIZE=$(curl -sIL \"$URL\" | tr -d '\\r' | awk 'tolower($1)==\"content-length:\"{v=$2} END{print v}')\necho \"ipsw: ${URL}\"; echo \"size: ${SIZE}\"\n[ -n \"$SIZE\" ] || { echo \"cannot read content-length\" >&2; exit 1; }\npython3 scripts/prepare-ipados18-components.py --remote --url \"$URL\" --size \"$SIZE\" \\\n  --output-dir apple/ipados18-22H374 --only KernelCache\nSRC=apple/ipados18-22H374/components/kernelcache.release.ipad7c\nDST=apple/ipados18-22H374/components/kernelcache.release.ipad7c.decompressed/kernelcache.release.ipad7c.decompressed\nmkdir -p \"$(dirname \"$DST\")\"\npython3 scripts/decompress-ipados18-kernelcache.py --im4p \"$SRC\" --output \"$DST\"\nls -l \"$SRC\" \"$DST\"\n"
    - name: build kernel (device kit builder, MACHINE_CONFIGS=PONG)
      working-directory: device
      env:
        UNIXNU_DEVICE: ${{ github.workspace }}/device
        JOBS: 4
      run: "OUT=../UniXNU/out/unicorn/${OS_PROFILE}/unicorn_ipados18\necho \"== 关键开关（.config 里没有就由 device defconfig 兜底）==\"\ngrep -E 'PONG_(POWER|WIFI|BACKLIGHT|APFS_DEBUG|ADRENO_PLATFORM)|OWNER_CACHE_MOUNT' \"$OUT/.config\" || echo \"(.config 不含 PONG_* 键)\"\nset +e\npython3 kits/PongPlatform24/build-kernel.py \\\n    --artifact-dir \"$OUT/kernel\" \\\n    --tree \"$OUT/tree\" \\\n    --config-path \"$OUT/.config\" \\\n    --hardware-dtb \"$OUT/device-tree/hardware.dtb\" \\\n    --jobs 4\nrc=$?\nif [ $rc -ne 0 ]; then\n  echo \"=== kit builder failed (rc=$rc); inner build log tail ===\"\n  LOG=$(ls -t ../build/unicorn/build-*.log 2>/dev/null | head -1)\n  if [ -n \"${LOG:-}\" ]; then echo \"log: $LOG\"; tail -120 \"$LOG\"; else echo \"no inner build log\"; fi\n  exit $rc\nfi\nls -l \"$OUT/kernel\" || true\nls -l \"$OUT/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_PONG/\" | head -20 || true\n"
    - name: patch the aggregate for on-screen panics (best effort)
      continue-on-error: true
      run: 'OUT=../UniXNU/out/unicorn/${OS_PROFILE}/unicorn_ipados18

        AGG="$OUT/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_PONG/mach.development.pong"

        NM=$(xcrun -f llvm-nm 2>/dev/null || true)

        if [ -n "${NM:-}" ]; then mkdir -p "$RUNNER_TEMP/nmbin"; ln -sf "$NM" "$RUNNER_TEMP/nmbin/llvm-nm"; export PATH="$RUNNER_TEMP/nmbin:$PATH"; fi

        # 把 panic() 改成画屏，并且插一段入口探针（不重启）。必须在 prelink 之前做：

        # prelink 之后内核 padding 已被 kext 占用，补丁会报 "Padding ... is not empty"。

        python3 "$OUT/tree/scripts/patch-xnu-entry-probe.py" "$AGG" --panic-screen --no-reset

        ls -l "$AGG"

        '
    - name: prelink kernel with the IPSW kernelcache (best effort)
      working-directory: UniXNU
      continue-on-error: true
      env:
        UNIXNU_DEVICE: ${{ github.workspace }}/device
      run: 'OUT=../UniXNU/out/unicorn/${OS_PROFILE}/unicorn_ipados18

        python3.12 ./unixnu prelink -D ../device

        ls -l "$OUT/kernel/" || true

        '
    - name: build payload
      working-directory: UniXNU
      env:
        UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
      run: '# patch-xnu-entry-probe.py 需要 llvm-nm；Xcode 自带，但不在默认 PATH。

        NM=$(xcrun -f llvm-nm 2>/dev/null || true)

        if [ -n "${NM:-}" ]; then mkdir -p "$RUNNER_TEMP/nmbin"; ln -sf "$NM" "$RUNNER_TEMP/nmbin/llvm-nm"; export PATH="$RUNNER_TEMP/nmbin:$PATH"; fi

        llvm-nm --version 2>/dev/null | head -1 || echo "llvm-nm 不可用"

        OUT=../UniXNU/out/unicorn/${OS_PROFILE}/unicorn_ipados18

        AGG="$OUT/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_PONG/mach.development.pong"

        ls -l "$AGG"

        mkdir -p "$OUT/kernel"

        # prelink 成功时 kernel.macho 已存在（含 kext），不要覆盖

        [ -s "$OUT/kernel/kernel.macho" ] || cp "$AGG" "$OUT/kernel/kernel.macho"

        python3.12 ./unixnu payload -D ../device --kernel "$OUT/kernel/kernel.macho"

        ls -l "$OUT/payload/" || true

        '
    - name: stage the locally built UEFI firmware
      run: |
        set -euo pipefail
        DEST=uefi-unicorn/Build/unicornPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd
        mkdir -p "$(dirname "$DEST")"
        cp device/prebuilt/SILICIUM_UEFI.fd "$DEST"
        test "$(wc -c < "$DEST" | tr -d ' ')" = 3145728
        shasum -a 256 "$DEST"
    - name: build boot image (v4, payload as ramdisk; needs a prebuilt firmware volume)
      working-directory: device
      run: "FD=../uefi-unicorn/Build/unicornPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd\nif [ ! -f \"$FD\" ]; then\n  echo \"跳过打包：CI 里没有 ${FD}（固件在本地编）。\"\n  echo \"本地组装： bash scripts/make-m3-image.sh --payload ../UniXNU/out/unicorn/${OS_PROFILE}/unicorn_ipados18/payload/payload.img\"\n  exit 0\nfi\nbash scripts/make-m3-image.sh \\\n  --payload ../UniXNU/out/unicorn/${OS_PROFILE}/unicorn_ipados18/payload/payload.img \\\n  --out ../UniXNU/out/unicorn/${OS_PROFILE}/unicorn_ipados18/boot-m3\nls -l ../UniXNU/out/unicorn/${OS_PROFILE}/unicorn_ipados18/boot-m3/\n"
    - name: upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unicorn-kernel-payload-boot
        path: 'UniXNU/out/unicorn/**/kernel/*

          UniXNU/out/unicorn/**/payload/*

          UniXNU/out/unicorn/**/boot/*.img

          UniXNU/out/unicorn/**/boot-m3/*.img

          UniXNU/out/unicorn/**/device-tree/*

          UniXNU/out/unicorn/**/logs/*

          build/**/*.log

          UniXNU/out/unicorn/**/logs/*.log

          private-inputs/*.json'
        if-no-files-found: warn
        retention-days: 14
    needs: userdata
    if: always() && (needs.userdata.result == 'success' || inputs.volume_layout_run != '')
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  userdata:
    name: userdata image (macOS)
    runs-on: macos-15-intel
    timeout-minutes: 300
    outputs:
      staged: ${{ steps.userland.outputs.staged }}
    steps:
    - uses: actions/checkout@v4
      with:
        path: device
        submodules: recursive
    - name: read the IPSW url from board.toml
      working-directory: device
      run: 'python3 - <<''PY'' >> $GITHUB_ENV

        import tomllib, pathlib

        ipsw = tomllib.loads(pathlib.Path(''board.toml'').read_text())[''ipsw'']

        print(''IPSW_URL='' + ipsw[''url''])

        print(''IPSW_SHA256='' + ipsw.get(''sha256'',''''))

        PY

        '
    - name: reclaim disk
      run: "set -euo pipefail\nselected=\"$(xcode-select -p)\"\necho \"xcode-select: ${selected}\"\n# Peak of this job is about 37 GiB: a 7.4 GiB download, the expanded\n# restore, two AEA decryptions, a fresh 5 GiB SystemOS and 8 GiB Data\n# volume, and a 19 GiB image. The unused Xcode copies go below 80 GiB\n# free; the selected one always stays.\nneed=$((80 * 1024 * 1024))\navail=\"$(df -k / | awk 'NR==2 {print $4}')\"\necho \"avail_kb=${avail} need_kb=${need}\"\nif [ \"$avail\" -lt \"$need\" ]; then\n  for app in /Applications/Xcode*.app; do\n    [ -d \"$app\" ] || continue\n    case \"$selected\" in\n      \"$app\"/*) echo \"keep $app\" ;;\n      *) echo \"remove $app\"; sudo rm -rf \"$app\" ;;\n    esac\n  done\nfi\nsudo rm -rf /Library/Developer/CoreSimulator/Caches /Library/Developer/CoreSimulator/Devices || true\nrm -rf \"$HOME/Library/Developer/CoreSimulator\" \"$HOME/Library/Developer/Xcode/DerivedData\" || true\ndf -h\n"
    - name: tools
      run: "set -euo pipefail\nexport HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1\n# decrypt-ipados18-aea.py unwraps the profile-1 AEA key with pyhpke\n# (DHKEM P-256 / HKDF-SHA256 / AES-256-GCM); it is a pure-Python\n# package not shipped on the runner image. The runner's Homebrew\n# Python is externally managed (PEP 668), so a plain pip install is\n# refused; --break-system-packages is the only way to reach it.\npython3 -m pip install --quiet --break-system-packages pyhpke\nok=1\nfor t in hdiutil diskutil aea python3; do\n  command -v \"$t\" >/dev/null || { echo \"missing tool: $t\"; ok=0; }\ndone\n# apply and build-systemos18 attach images with ownership on, so they\n# need root without a prompt. A runner that cannot sudo is a failure,\n# not a skip: a userland prepared without it boots nothing.\nsudo -n true || { echo 'this runner cannot sudo -n, and the userland chain needs it'; ok=0; }\n[ \"$ok\" = 1 ]\n"
    - name: prepared userland from the IPSW
      id: userland
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nurl=\"$(printf '%s' \"${IPSW_URL}\" | tr -d '[:space:]')\"\nsha=\"$(printf '%s' \"${IPSW_SHA256}\" | tr -d '[:space:]' | tr 'A-F' 'a-f')\"\nif [ -z \"$url\" ]; then\n  echo 'No ipsw_url input: no prepared userland, so this job builds no userdata image.'\n  echo 'The package job still runs and packages the kernel, the payload and the boot'\n  echo 'image; its volume layout falls back to uuid5 placeholders.'\n  printf '%s\\n' 'staged=false' >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\ncase \"$url\" in\n  https://*) ;;\n  *) echo \"ipsw_url must be an https URL, got: ${url}\" >&2; exit 1 ;;\nesac\nrm -rf \"${RUNNER_TEMP}/pong-userland\" \"${RUNNER_TEMP}/pong-ipsw-work\"\npython3 device/scripts/prepare-pong-userland-from-ipsw.py \\\n  --ipsw-url \"$url\" \\\n  --work-dir \"${RUNNER_TEMP}/pong-ipsw-work\" \\\n  --out \"${RUNNER_TEMP}/pong-userland\" \\\n  --developer \"$(xcode-select -p)\" \\\n  --json-out ci-userland-from-ipsw.json \\\n  --volume-layout-out ci-volume-layout.json\
        \ \\\n  --jobs 4 \\\n  ${sha:+--ipsw-sha256 \"$sha\"}\nprintf '%s\\n' \"${RUNNER_TEMP}/pong-userland\" > ci-userland-path.txt\n# The layout below reads the images this run made; a placeholder UUID\n# here would compile a kernel that mounts nothing.\npython3 - <<'PY'\nimport json\nfrom pathlib import Path\nlayout = json.loads(Path('ci-volume-layout.json').read_text())\nreport = json.loads(Path('ci-userland-from-ipsw.json').read_text())\nif layout.get('ci_placeholder'):\n    raise SystemExit('ci-volume-layout.json still holds placeholders')\nfor key in ('os', 'systemos', 'data'):\n    if len(layout.get(key, {}).get('uuid', '')) != 36:\n        raise SystemExit('ci-volume-layout.json has no usable %s uuid' % key)\nif report.get('build') != '22H374':\n    raise SystemExit('the userland report names build %r' % report.get('build'))\nprint('userland bytes', report['userland_bytes'], 'in', report['seconds'], 'seconds')\nfor name in ('os', 'systemos', 'data'):\n    print(' ', name, layout[name]['uuid'])\n\
        PY\ndf -h\nprintf '%s\\n' 'staged=true' >> \"$GITHUB_OUTPUT\"\n"
    - name: SHNGROOT directory
      if: steps.userland.outputs.staged == 'true'
      timeout-minutes: 120
      run: "set -euo pipefail\nprepared=\"$(cat ci-userland-path.txt)\"\nmkdir -p out/ipados18/ufs\npython3 device/scripts/prepare-ipados18-ufs-layout.py \\\n  --userland \"${prepared}\" \\\n  --systemos \"${prepared}/pong-ipados18-systemos.cdr\" \\\n  --volume-layout ci-volume-layout.json \\\n  --output-dir out/ipados18/ufs\npython3 - <<'PY'\nimport json\nfrom pathlib import Path\nheader = Path('out/ipados18/ufs/shngroot-ipados18.bin').read_bytes()\nlayout = json.loads(Path('out/ipados18/ufs/ufs-layout.json').read_text())\nnames = [window['name'] for window in layout['windows']]\nif header[:8] != b'SHNGROOT' or len(header) != 4096:\n    raise SystemExit('the SHNGROOT header is not a 4096-byte directory')\nif names != ['OS', 'SystemOS', 'Data']:\n    raise SystemExit('layout windows are %s, not OS/SystemOS/Data' % names)\nprint('SHNGROOT directory', len(header), 'bytes for', ', '.join(names))\nPY\ndf -h\n"
    - name: userdata image
      if: steps.userland.outputs.staged == 'true'
      timeout-minutes: 150
      run: "set -euo pipefail\nprepared=\"$(cat ci-userland-path.txt)\"\nmkdir -p ci-products\npython3 device/scripts/build-pong-userdata-image.py \\\n  --layout out/ipados18/ufs/ufs-layout.json \\\n  --header out/ipados18/ufs/shngroot-ipados18.bin \\\n  --output out/ipados18/ufs/pong-ipados18-userdata.img \\\n  --max-parts 4 \\\n  --part-max-mib 8192 \\\n  --delete-sources \\\n  --delete-root \"${prepared}\" \\\n  --json-out userdata-image.json\npython3 - <<'PY'\nimport json\nfrom pathlib import Path\nimage = json.loads(Path('userdata-image.json').read_text())\nif image['image_bytes'] <= 0 or not image['parts']:\n    raise SystemExit('the image builder wrote no parts')\ntotal = sum(part['bytes'] for part in image['parts'])\nif total != image['image_bytes']:\n    raise SystemExit('the parts hold %d bytes, the image is %d' % (total, image['image_bytes']))\nprint('userdata image', image['image_bytes'], 'bytes in', len(image['parts']), 'part(s)')\nPath('ci-products/userdata-image.json').write_text(json.dumps(image,\
        \ indent=2) + '\\n')\nPY\ncp -f ci-volume-layout.json ci-products/ci-volume-layout.json\ndf -h\n"
    - uses: actions/upload-artifact@v4
      if: steps.userland.outputs.staged == 'true'
      with:
        name: unicorn-userdata
        retention-days: 30
        if-no-files-found: error
        path: 'ci-products/

          out/ipados18/ufs/pong-ipados18-userdata.img.part*

          '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: volume-layout
        retention-days: 1
        if-no-files-found: ignore
        path: 'ci-volume-layout.json

          userdata-image.json

          '
    if: inputs.volume_layout_run == ''
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
